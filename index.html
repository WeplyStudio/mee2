    <!-- Google AdSense - Deferred to First User Interaction or Post-Load Idle for Max Lighthouse Performance -->
    <script>
      (function() {
        var adsenseLoaded = false;
        function loadAdSense() {
          if (adsenseLoaded) return;
          adsenseLoaded = true;
          var s = document.createElement('script');
          s.async = true;
          s.src = "https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2678635841290127";
          s.crossOrigin = "anonymous";
          document.head.appendChild(s);
          window.removeEventListener('scroll', loadAdSense);
          window.removeEventListener('mousemove', loadAdSense);
          window.removeEventListener('touchstart', loadAdSense);
        }
        window.addEventListener('scroll', loadAdSense, { passive: true });
        window.addEventListener('mousemove', loadAdSense, { passive: true });
        window.addEventListener('touchstart', loadAdSense, { passive: true });
        if ('requestIdleCallback' in window) {
          requestIdleCallback(function() { setTimeout(loadAdSense, 3000); });
        } else {
          setTimeout(loadAdSense, 3500);
        }
      })();
    </script>

    <!-- Immediate early protection against Ctrl+U, Right-click on images, and Copying -->
    <script>
      (function() {
        // Intercept right click on images and context menu
        document.addEventListener('contextmenu', function(e) {
          var t = e.target;
          if (t && (t.tagName === 'IMG' || t.tagName === 'PICTURE' || t.tagName === 'SVG' || t.tagName === 'CANVAS' || t.closest('img, picture, svg, figure, canvas, [role="img"]'))) {
            e.preventDefault();
            return false;
          }
          if (t && (t.tagName !== 'INPUT' && t.tagName !== 'TEXTAREA' && !t.isContentEditable)) {
            e.preventDefault();
            return false;
          }
        }, true);

        // Intercept Ctrl+U, Cmd+U, F12, DevTools shortcuts
        window.addEventListener('keydown', function(e) {
          var isCtrl = e.ctrlKey || e.metaKey;
          var key = (e.key || '').toLowerCase();
          var code = e.keyCode || e.which;
          if (isCtrl && (key === 'u' || code === 85)) {
            e.preventDefault();
            e.stopPropagation();
            return false;
          }
          if (code === 123 || (isCtrl && e.shiftKey && (key === 'i' || key === 'j' || key === 'c'))) {
            e.preventDefault();
            e.stopPropagation();
            return false;
          }
        }, true);

        // Intercept text dragging and copying
        document.addEventListener('copy', function(e) {
          var t = e.target;
          if (!t || (t.tagName !== 'INPUT' && t.tagName !== 'TEXTAREA' && !t.isContentEditable)) {
            e.preventDefault();
            return false;
          }
        }, true);
      })();
    </script>
