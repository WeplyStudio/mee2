<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <rect width="1200" height="630" fill="#0c0c0d"/>
  
  <!-- Subtle grid pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="80%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#ea580c" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0c0c0d" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Top Pill Badge -->
  <rect x="80" y="80" width="180" height="44" rx="22" fill="#18181b" stroke="rgba(255,255,255,0.1)"/>
  <circle cx="106" cy="102" r="4" fill="#22c55e"/>
  <text x="122" y="107" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="14" font-weight="600" fill="#a1a1aa" letter-spacing="0.5">PORTFOLIO • 2026</text>

  <!-- Main Headline with brackets -->
  <text x="80" y="240" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="64" font-weight="700" fill="#ffffff" letter-spacing="-1.5">
    [ jason ]
  </text>

  <!-- Subtitle / Role -->
  <text x="80" y="320" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="28" font-weight="400" fill="#a1a1aa">
    Design Engineer &amp; Software Architecture
  </text>

  <text x="80" y="370" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="22" font-weight="300" fill="#71717a">
    Making the complex simple — and the simple meaningful.
  </text>

  <!-- Bottom Badges / Metrics -->
  <g transform="translate(80, 480)">
    <rect x="0" y="0" width="220" height="70" rx="12" fill="#18181b" stroke="rgba(255,255,255,0.08)"/>
    <text x="24" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="500" fill="#71717a">SPECIALTY</text>
    <text x="24" y="54" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="600" fill="#ffffff">UI/UX &amp; Frontend</text>

    <rect x="240" y="0" width="220" height="70" rx="12" fill="#18181b" stroke="rgba(255,255,255,0.08)"/>
    <text x="264" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="500" fill="#71717a">PROJECTS</text>
    <text x="264" y="54" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="600" fill="#ffffff">Zylo, Trufin, Krig</text>

    <rect x="480" y="0" width="220" height="70" rx="12" fill="#18181b" stroke="rgba(255,255,255,0.08)"/>
    <text x="504" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="500" fill="#71717a">AVAILABILITY</text>
    <text x="504" y="54" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="600" fill="#22c55e">Open for Projects</text>
  </g>
</svg>
